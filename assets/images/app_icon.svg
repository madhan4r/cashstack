<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="cashStack app icon">
  <title>cashStack app icon</title>
  <desc>cashStack app icon — a mint cash stack with a gold coin on a deep green rounded tile.</desc>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="#064e3b"/>

  <!-- icon: ascending cash stack -->
  <rect x="140" y="326" width="190" height="38" rx="19" fill="#34d399"/>
  <rect x="160" y="280" width="180" height="38" rx="19" fill="#6ee7b7"/>
  <rect x="180" y="234" width="170" height="38" rx="19" fill="#a7f3d0"/>

  <!-- coin -->
  <circle cx="340" cy="210" r="48" fill="#fbbf24"/>
  <text x="340" y="228" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="600" fill="#78350f">&#8377;</text>
</svg>
